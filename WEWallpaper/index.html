<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landscape GIF Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
    }
    .wallpaper-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .wallpaper-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>

  <div class="wallpaper-container">
    <!-- Updated with your requested direct URL -->
    <img class="wallpaper-gif" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWRjcjkwcnYwN3R5dzdzNDhmeHJtZmY5d3ZjZ253bnExNDY4dXd4dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Wm9XlKG2xIMiVcH4CP/giphy.gif" alt="Vaporwave Background">
  </div>

  <!-- Be sure your music file is named music.ogg and placed in the same folder -->
  <audio id="bg-audio" src="music.ogg" autoplay loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');

    window.wallpaperPropertyListener = {
      setPaused: function(isPaused) {
        if (isPaused) {
          audio.pause();
        } else {
          audio.play().catch(err => console.log("Audio playback blocked:", err));
        }
      }
    };
  </script>

</body>
</html>
