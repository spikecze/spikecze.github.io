<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landscape Live Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
    }
    .wallpaper-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>

  <div class="wallpaper-container">
    <!-- Tvůj přímý AlphaCoders link -->
    <img src="https://giffiles.alphacoders.com/220/220240.gif" alt="Synthwave Highway">
  </div>

  <!-- Tvoje lokální hudba z GitHub složky -->
  <audio id="bg-audio" src="music.ogg" loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');

    function tryPlay() {
      audio.play().catch(() => console.log("Click page to unblock sound"));
    }

    window.addEventListener('DOMContentLoaded', tryPlay);

    // Spuštění zvuku po kliknutí (pro testování v klasickém prohlížeči)
    window.addEventListener('click', () => {
      if (audio.paused) audio.play();
    });

    // Ovládání pro Wallpaper Engine (vypne hudbu při hře na fullscrenu)
    window.wallpaperPropertyListener = {
      setPaused: function(isPaused) {
        if (isPaused) {
          audio.pause();
        } else {
          audio.play().catch(err => console.log("Audio blocked:", err));
        }
      }
    };
  </script>

</body>
</html>
