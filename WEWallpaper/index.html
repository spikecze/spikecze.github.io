<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landscape Live Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    .wallpaper-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>

  <div class="wallpaper-container">
    <!-- Načítá tvůj GIF pod správným názvem -->
    <img src="220240.gif" alt="Synthwave Highway">
  </div>

  <audio id="bg-audio" src="music.ogg" autoplay loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');
    window.wallpaperPropertyListener = {
      setPaused: function(isPaused) {
        if (isPaused) {
          audio.pause();
        } else {
          audio.play().catch(err => console.log("Audio blocked:", err));
        }
      }
    };
  </script>

</body>
</html>
