)<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landscape Live Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
    }
    .wallpaper-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>

  <div class="wallpaper-container">
    <!-- Načítá tvůj GIF přímo z tvé složky na GitHubu, takže ho žádný cizí server nezablokuje -->
    <img src="220240.gif" alt="Synthwave Highway HD">
  </div>

  <!-- Standardní HTML audio, které funguje spolehlivě z GitHub Pages -->
  <audio id="bg-audio" src="music.wav" loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');

    function tryPlay() {
      audio.play().catch(() => {
        console.log("Autoplay čeká na interakci v prohlížeči.");
      });
    }

    window.addEventListener('DOMContentLoaded', tryPlay);

    // Ruční aktivace zvuku při testování na webu (stačí kliknout kamkoliv do plochy)
    window.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(err => console.log("Chyba přehrávání:", err));
      }
    });

    // Propojení s Wallpaper Engine (automaticky vypne zvuk, když hraješ hru)
    window.wallpaperPropertyListener = {
      setPaused: function(isPaused) {
        if (isPaused) {
          audio.pause();
        } else {
          audio.play().catch(err => console.log("Audio blocked:", err));
        }
      }
    };
  </script>

</body>
</html>
