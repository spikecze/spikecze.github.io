<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landscape Live Wallpaper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
    }
    .wallpaper-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>

  <div class="wallpaper-container">
    <!-- Lokální načítání tvého staženého GIFu -->
    <img src="220240.gif" alt="Synthwave Highway HD">
  </div>

  <audio id="bg-audio" loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');

    // Natvrdo stáhneme tvůj 2MB soubor jako surová data a vytvoříme z něj funkční audio objekt
    fetch('music.wav')
      .then(response => response.blob())
      .then(blob => {
        const blobUrl = URL.createObjectURL(blob);
        audio.src = blobUrl;
        audio.play().catch(() => console.log("Čekám na kliknutí pro spuštění zvuku..."));
      })
      .catch(err => console.error("Chyba při stahování music.wav:", err));

    // TEST V PROHLÍŽEČI: Kliknutím kamkoliv do plochy webu zvuk okamžitě vynutíš
    window.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(err => console.log("Audio trigger error:", err));
      }
    });

    // Systémové ovládání pro Wallpaper Engine (vypne hudbu, když zapneš hru)
    window.wallpaperPropertyListener = {
      setPaused: function(isPaused) {
        if (isPaused) {
          audio.pause();
        } else {
          audio.play().catch(err => console.log("Audio performance block:", err));
        }
      }
    };
  </script>

</body>
</html>
